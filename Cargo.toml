[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fixtures/test-plugin", "fixtures/pdk-sample"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Wolfware LLC"]
repository = "https://github.com/wolfware-labs/moonlit"
homepage = "https://moonlit.rs/"
rust-version = "1.97"

[workspace.dependencies]
wit-parser = "0.258"
wit-bindgen = "0.62.0"
saphyr-parser = "=0.0.12"
miette = "7.6"
thiserror = "2.0"
indexmap = "2.14"
dotenvy = "0.15"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rhai = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
oci-client = { version = "0.17", default-features = false, features = ["rustls-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
toml = "1"
sha2 = "0.11"
hex = "0.4"
dirs = "7"
base64 = "0.23"
wiremock = "0.6"
tempfile = "3"
wasmtime = { version = "48.0.2", features = ["component-model", "async"] }
wasmtime-wasi = "48.0.2"
wasmtime-wasi-http = "48.0.2"
wasmparser = "0.258"
anyhow = "1"
hyper = "1"
http-body-util = "0.1"
globset = "0.4"
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
comfy-table = "8"
console = "0.16"
serde_yaml_ng = "0.10"
humantime = "2"
assert_cmd = "2"
cliclack = "0.5"
syn = "3"
quote = "1"
proc-macro2 = "1"
flate2 = "1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
