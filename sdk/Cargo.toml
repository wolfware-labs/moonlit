[package]
name = "moonlit-sdk"
version = "0.1.1"
edition = "2021"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "SDK for writing Moonlit release-pipeline plugins as WebAssembly components."
readme = "README.md"
keywords = ["moonlit", "plugin", "wasm", "release", "sdk"]
categories = ["development-tools", "wasm"]
documentation = "https://docs.rs/moonlit-sdk"

[dependencies]
wit-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
moonlit-sdk-macros = { path = "../sdk-macros", version = "0.1.1" }
flate2 = { workspace = true }
