[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "msi", "npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Publish the Homebrew formula to our tap and the npm package to our scope
tap = "wolfware-labs/homebrew-tap"
npm-scope = "@moonlitbuild"
npm-package = "cli"
publish-jobs = ["homebrew", "./publish-npm", "./publish-choco"]

# The choco job authenticates to Chocolatey with an API key (not GITHUB_TOKEN),
# so it does not need the default id-token/packages write. It only needs
# contents:write to append a Chocolatey section to the release notes (dist does
# not list custom-job channels there).
[dist.github-custom-job-permissions]
publish-choco = { contents = "write" }
