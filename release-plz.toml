# release-plz configuration.
# Release management is disabled workspace-wide and re-enabled per package:
#   - the SDK library crates are versioned AND published to crates.io, but get
#     no GitHub release (they ship via crates.io; a GitHub release for an SDK
#     tag would steal `/releases/latest`, which the CLI installers depend on).
# The `moonlit` CLI and `moonlit-engine` are NOT versioned by release-plz —
# they are owned by semantic-release (see .releaserc.json +
# .github/workflows/semantic-release.yml), which bumps the workspace version
# from Conventional Commits and tags `moonlit-v{version}` to trigger dist.
# release-plz cannot version the CLI anyway: it `cargo package`s every
# release=true crate, which fails on the CLI's unpublished `moonlit-engine`
# path dependency.
[workspace]
release = false

[[package]]
name = "moonlit-sdk-macros"
release = true
git_release_enable = false

[[package]]
name = "moonlit-sdk"
release = true
git_release_enable = false

[[package]]
name = "moonlit"
# Owned by semantic-release, not release-plz. Left here (release = false) as an
# explicit marker so nobody re-enables release-plz versioning for the CLI.
release = false
# Must still mirror Cargo.toml's `publish = false`: release-plz validates the
# publish flag of every listed package against its Cargo.toml even when
# release = false, and errors on a mismatch.
publish = false
