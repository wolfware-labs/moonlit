# release-plz configuration.
# Release management is disabled workspace-wide and re-enabled per package:
#   - the SDK library crates are versioned AND published to crates.io;
#   - the `moonlit` CLI is versioned and tagged (so dist can build a release
#     from the tag) but never published to crates.io (`publish = false`) and
#     gets no release-plz GitHub release — dist owns that.
# The engine is never versioned by release-plz (it inherits the workspace
# version bumped alongside the CLI, and ships only as part of the binary).
[workspace]
release = false

[[package]]
name = "moonlit-sdk-macros"
release = true

[[package]]
name = "moonlit-sdk"
release = true

[[package]]
name = "moonlit"
release = true
git_tag_enable = true
git_tag_name = "moonlit-v{{ version }}"
git_release_enable = false
