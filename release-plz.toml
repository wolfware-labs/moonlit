# release-plz configuration.
# Release management is disabled workspace-wide and re-enabled per package:
#   - the SDK library crates are versioned AND published to crates.io;
#   - the `moonlit` CLI is versioned and tagged (so dist can build a release
#     from the tag) but never published to crates.io (`publish = false`) and
#     gets no release-plz GitHub release — dist owns that.
# The engine is never versioned by release-plz (it inherits the workspace
# version bumped alongside the CLI, and ships only as part of the binary).
[workspace]
release = false

[[package]]
name = "moonlit-sdk-macros"
release = true

[[package]]
name = "moonlit-sdk"
release = true

[[package]]
name = "moonlit"
release = true
publish = false # binary, never published to crates.io (matches Cargo.toml)
# Automated tagging is deferred until the release infrastructure exists
# (Homebrew tap repo, npm/Chocolatey/winget accounts and secrets), so a tag
# does not prematurely trigger a half-configured dist release. Until then the
# maintainer creates `moonlit-v*` tags manually; flip this to `true` to enable
# release-plz to tag automatically once the infrastructure is ready.
git_tag_enable = false
git_tag_name = "moonlit-v{{ version }}"
git_release_enable = false
