version: 2
updates:
  # Actions are pinned to commit SHAs, which is the only reference an upstream
  # owner cannot repoint at new code. That safety is worth nothing if the pins
  # never move: without this file four docker/* actions drifted a full major
  # behind and started warning about a deprecated Node runtime. Dependabot
  # rewrites both the SHA and the trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # These cannot move independently. wasmtime pins wasmparser and
      # wit-parser to an exact minor (48.0.2 wants ^0.254), so a PR bumping one
      # of them alone either fails to resolve or quietly leaves two
      # incompatible copies in the graph -- and the engine hands wasmparser
      # types straight to wasmtime. One PR, moved as a set, reviewed as a set.
      wasm-runtime:
        patterns:
          - "wasmtime*"
          - "wasmparser"
          - "wasm-encoder"
          - "wit-parser"
          - "wit-bindgen*"
      # Everything else that is compatible by semver, batched so a weekly run
      # is one reviewable PR instead of thirty. Majors are deliberately not in
      # here: each one is a breaking change that deserves its own PR and its
      # own test run.
      cargo-compatible:
        patterns:
          - "*"
        exclude-patterns:
          - "wasmtime*"
          - "wasmparser"
          - "wasm-encoder"
          - "wit-parser"
          - "wit-bindgen*"
        update-types:
          - minor
          - patch
