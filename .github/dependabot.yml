version: 2
updates:
  # Actions are pinned to commit SHAs, which only helps if something moves them.
  # Dependabot rewrites the SHA and its trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # These cannot move independently: wasmtime pins wasmparser and wit-parser
      # to an exact minor, so bumping one alone leaves two copies in the graph.
      # Grouping batches them into one PR; it does not make them agree on a
      # version, so check that by hand.
      wasm-runtime:
        patterns:
          - "wasmtime*"
          - "wasmparser"
          - "wasm-encoder"
          - "wit-parser"
          - "wit-bindgen*"
      # The semver-compatible rest, batched into one PR. Majors are excluded so
      # each breaking change gets its own PR and test run.
      cargo-compatible:
        patterns:
          - "*"
        exclude-patterns:
          - "wasmtime*"
          - "wasmparser"
          - "wasm-encoder"
          - "wit-parser"
          - "wit-bindgen*"
        update-types:
          - minor
          - patch
