name: CodeQL

# main's ruleset requires a CodeQL analysis (alerts_threshold: errors) before a
# pull request can merge. Nothing produced one, so every PR sat in "Waiting for
# Code Scanning results" and the only way to land a change was to bypass the
# ruleset. This is the analysis that rule is waiting for.
#
# GitHub reports two analysable languages for this repository
# (`gh api repos/wolfware-labs/moonlit/code-scanning/default-setup`): `rust`,
# the workspace itself, and `actions`, the workflow files -- which is worth
# having when those workflows hold the publishing credentials.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # A weekly run catches newly published queries finding old code. Off-peak
    # Monday so it does not queue behind the weekday pushes.
    - cron: "27 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Uploading the SARIF results is what makes the ruleset's gate pass.
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: "/language:${{ matrix.language }}"
