name: Audit

# Checks Cargo.lock against the RustSec advisory database. The schedule is
# there because advisories appear without any commit to this repo. Warnings
# (unmaintained, unsound) stay warnings; only a vulnerability fails the job.
#
# The job reports, it does not gate: the path filters below mean it cannot be a
# required check, because a pull request that skips it would wait forever.

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  # A scheduled run must not cancel the run of a push to main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-audit@0.22.2
      - name: cargo audit
        run: cargo audit
