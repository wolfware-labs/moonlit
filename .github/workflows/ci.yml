name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Line tables only: full debuginfo made ld run out of memory linking the
      # engine's integration tests. CI-scoped.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all
      # The docker job packages this rather than building its own. Copy, not
      # move: the cache saves `target`, so removing it would force a relink.
      - name: Stage the CLI binary for the docker job
        run: |
          mkdir -p dist/linux/amd64
          cp target/debug/moonlit dist/linux/amd64/moonlit
          strip dist/linux/amd64/moonlit
          ls -la dist/linux/amd64/moonlit
      - name: Upload the CLI binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: moonlit-linux-amd64
          path: dist/linux/amd64/moonlit
          retention-days: 1

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # OIDC rather than a stored CODECOV_TOKEN, so there is no secret to rotate.
    # Fork PRs cannot mint one, so the upload is best-effort there.
    permissions:
      contents: read
      id-token: write
    env:
      # Same debuginfo trim as the check job: llvm-cov links the very same heavy
      # moonlit-engine integration-test binaries, with instrumentation on top.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4e14a60b36eb62630dcc25614f0be0659ab8830c # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keyed apart from the check job: coverage builds are instrumented, so
          # they would otherwise evict the plain test artifacts on every run.
          key: ${{ runner.os }}-cargo-llvmcov-${{ hashFiles('**/Cargo.lock') }}
      - name: Generate coverage
        run: cargo llvm-cov --all --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          use_oidc: true
          # A coverage upload outage must not fail a PR; the check job is the gate.
          fail_ci_if_error: false

  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the CLI binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moonlit-linux-amd64
          path: dist/linux/amd64
      - name: Restore the executable bit
        # upload-artifact does not preserve file modes.
        run: chmod +x dist/linux/amd64/moonlit
      - name: Build the image (amd64 only, never pushed)
        run: |
          version="$(dist/linux/amd64/moonlit --version | awk '{print $2}')"
          echo "MOONLIT_VERSION=$version" >> "$GITHUB_ENV"
          docker build \
            --build-arg "MOONLIT_VERSION=$version" \
            --build-arg "VCS_REF=${GITHUB_SHA::7}" \
            -t moonlit:ci \
            .
      - name: Run the image assertion suite
        run: scripts/test-docker-image.sh moonlit:ci "$MOONLIT_VERSION"

  dist-plan:
    name: dist plan (release config)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Install the version dist-workspace.toml pins: dist refuses to run against
      # a config pinned older than itself, so `latest` breaks on every upstream
      # release.
      - name: Install dist
        run: |
          set -euo pipefail
          version="$(grep -oP 'cargo-dist-version\s*=\s*"\K[^"]+' dist-workspace.toml)"
          echo "installing dist ${version} (pinned in dist-workspace.toml)"
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${version}/cargo-dist-installer.sh" | sh
      - name: Validate release plan
        run: dist plan
