name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    env:
      # Trim debuginfo to line tables only: keeps backtrace line numbers while
      # cutting link-time memory, which was crashing ld (SIGBUS) when linking the
      # heavy moonlit-engine integration-test binaries. CI-scoped; local builds
      # keep full debuginfo.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all
      # The docker job packages this binary instead of compiling its own. Copy
      # rather than move — the cache post-step saves `target`, and removing the
      # binary from it would force a relink on the next run. The copy is
      # stripped because the unstripped debug binary is ~657 MB, and uploading
      # that costs more than the build it saves.
      - name: Stage the CLI binary for the docker job
        run: |
          mkdir -p dist/linux/amd64
          cp target/debug/moonlit dist/linux/amd64/moonlit
          strip dist/linux/amd64/moonlit
          ls -la dist/linux/amd64/moonlit
      - name: Upload the CLI binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: moonlit-linux-amd64
          path: dist/linux/amd64/moonlit
          retention-days: 1

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # OIDC instead of a stored CODECOV_TOKEN: GitHub mints a short-lived identity
    # token for this job and Codecov verifies it, so there is no long-lived secret
    # to store or rotate. Fork PRs cannot mint one; the upload is best-effort there.
    permissions:
      contents: read
      id-token: write
    env:
      # Same debuginfo trim as the check job: llvm-cov links the very same heavy
      # moonlit-engine integration-test binaries, with instrumentation on top.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4e14a60b36eb62630dcc25614f0be0659ab8830c # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keyed apart from the check job: coverage builds are instrumented, so
          # they would otherwise evict the plain test artifacts on every run.
          key: ${{ runner.os }}-cargo-llvmcov-${{ hashFiles('**/Cargo.lock') }}
      - name: Generate coverage
        run: cargo llvm-cov --all --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: lcov.info
          use_oidc: true
          # A coverage upload outage must not fail a PR; the check job is the gate.
          fail_ci_if_error: false

  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download the CLI binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: moonlit-linux-amd64
          path: dist/linux/amd64
      - name: Restore the executable bit
        # upload-artifact does not preserve file modes.
        run: chmod +x dist/linux/amd64/moonlit
      - name: Build the image (amd64 only, never pushed)
        run: |
          version="$(dist/linux/amd64/moonlit --version | awk '{print $2}')"
          echo "MOONLIT_VERSION=$version" >> "$GITHUB_ENV"
          docker build \
            --build-arg "MOONLIT_VERSION=$version" \
            --build-arg "VCS_REF=${GITHUB_SHA::7}" \
            -t moonlit:ci \
            .
      - name: Run the image assertion suite
        run: scripts/test-docker-image.sh moonlit:ci "$MOONLIT_VERSION"

  dist-plan:
    name: dist plan (release config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dist
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/latest/download/cargo-dist-installer.sh | sh
      - name: Validate release plan
        run: dist plan
