name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    env:
      # Trim debuginfo to line tables only: keeps backtrace line numbers while
      # cutting link-time memory, which was crashing ld (SIGBUS) when linking the
      # heavy moonlit-engine integration-test binaries. CI-scoped; local builds
      # keep full debuginfo.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v6
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # OIDC instead of a stored CODECOV_TOKEN: GitHub mints a short-lived identity
    # token for this job and Codecov verifies it, so there is no long-lived secret
    # to store or rotate. Fork PRs cannot mint one; the upload is best-effort there.
    permissions:
      contents: read
      id-token: write
    env:
      # Same debuginfo trim as the check job: llvm-cov links the very same heavy
      # moonlit-engine integration-test binaries, with instrumentation on top.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keyed apart from the check job: coverage builds are instrumented, so
          # they would otherwise evict the plain test artifacts on every run.
          key: ${{ runner.os }}-cargo-llvmcov-${{ hashFiles('**/Cargo.lock') }}
      - name: Generate coverage
        # --skip build_produces_and_validates_a_component: llvm-cov exports
        # `-C instrument-coverage` globally, and that test drives `moonlit plugin
        # build`, which spawns a nested `cargo build --target wasm32-wasip2`. The
        # child inherits the flag and fails with E0463 (`profiler_builtins` has no
        # wasm32-wasip2 build). The test still runs unskipped in the check job, so
        # it stays gated - only its coverage is missing.
        run: cargo llvm-cov --all --lcov --output-path lcov.info -- --skip build_produces_and_validates_a_component
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          use_oidc: true
          # A coverage upload outage must not fail a PR; the check job is the gate.
          fail_ci_if_error: false

  dist-plan:
    name: dist plan (release config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dist
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/latest/download/cargo-dist-installer.sh | sh
      - name: Validate release plan
        run: dist plan
