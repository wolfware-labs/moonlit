name: semantic-release (CLI)

# Versions and tags the `moonlit` CLI from Conventional Commits. On every push
# to main it inspects the commits since the last `moonlit-v*` tag: SDK-scoped
# commits are ignored (the SDK crates are versioned separately by release-plz),
# and anything touching the CLI or engine drives the bump. It then writes the
# new workspace version into Cargo.toml/Cargo.lock, updates cli/CHANGELOG.md,
# commits with [skip ci], and tags `moonlit-v<version>` — which triggers the
# dist release workflow (release.yml) to build the binary and publish it to
# GitHub Releases, Homebrew, npm, and Chocolatey.

on:
  push:
    branches: [main]

concurrency:
  group: semantic-release-cli
  cancel-in-progress: false

jobs:
  release:
    name: version + tag the moonlit CLI
    # Don't re-run on our own release commit. The release commit is pushed with
    # a PAT (so its tag can trigger dist), which means it is NOT suppressed by
    # the GITHUB_TOKEN rule and would otherwise re-enter this workflow. The
    # message is intentionally free of [skip ci]: that marker also skips the
    # tag push, which must reach the dist release workflow.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history + tags so semantic-release can find the last
          # moonlit-v* tag and analyze every commit since it.
          fetch-depth: 0
          # Push the release commit + tag with a PAT (RELEASE_PAT) so the
          # moonlit-v* tag is attributed to a real user and TRIGGERS the dist
          # release workflow. GitHub deliberately suppresses tag-triggered
          # workflows for pushes made with the built-in GITHUB_TOKEN, so the
          # default token would tag the release but never build the binary.
          # Falls back to GITHUB_TOKEN if the PAT secret is not configured
          # (versioning/tagging still works; the tag must then be re-pushed by
          # a user to build the binary).
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Rust toolchain
        # prepareCmd runs `cargo update --workspace` to sync Cargo.lock.
        uses: dtolnay/rust-toolchain@stable
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx --yes
          -p semantic-release@24
          -p conventional-changelog-conventionalcommits@9
          -p @semantic-release/changelog@6
          -p @semantic-release/exec@7
          -p @semantic-release/git@10
          semantic-release
