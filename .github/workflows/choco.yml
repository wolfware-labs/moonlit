name: Publish to Chocolatey

on:
  release:
    types: [published]

jobs:
  chocolatey:
    name: choco pack and push
    runs-on: windows-latest
    if: ${{ !github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release artifact
        id: art
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = ($env:TAG -replace '^moonlit-v', '')
          $asset = "moonlit-x86_64-pc-windows-msvc.zip"
          $url = "https://github.com/wolfware-labs/moonlit/releases/download/$env:TAG/$asset"
          $tmp = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri $url -OutFile $tmp
          $sha = (Get-FileHash $tmp -Algorithm SHA256).Hash.ToLower()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "url=$url"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "checksum=$sha"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Bake URL + checksum into the install script and pack
        shell: pwsh
        env:
          VERSION: ${{ steps.art.outputs.version }}
          URL64: ${{ steps.art.outputs.url }}
          CHECKSUM64: ${{ steps.art.outputs.checksum }}
        run: |
          $script = 'packaging/chocolatey/tools/chocolateyinstall.ps1'
          (Get-Content $script -Raw) `
            -replace '__URL64__', $env:URL64 `
            -replace '__CHECKSUM64__', $env:CHECKSUM64 |
            Set-Content -NoNewline $script
          choco pack packaging/chocolatey/moonlit.nuspec `
            --version $env:VERSION `
            --outputdirectory $env:RUNNER_TEMP
      - name: Push
        shell: pwsh
        env:
          VERSION: ${{ steps.art.outputs.version }}
          CHOCO_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP "moonlit.$env:VERSION.nupkg"
          choco push $pkg --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
