name: Publish Chocolatey

# Custom dist publish-job. Runs inside dist's release (after the release + its
# assets exist), so it does not rely on the `release: published` event — which a
# GITHUB_TOKEN-created release does not fire. Self-contained: it downloads the
# public Windows build, generates the nuspec + install script inline, packs, and
# pushes. CHOCOLATEY_API_KEY arrives via dist's `secrets: inherit`.

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  # Manual re-push for a tag that was released but never landed on Chocolatey
  # (a push rejected while the package was in moderation, an expired key, a
  # transient outage). Takes the tag directly instead of a dist plan.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. moonlit-v1.1.6
        required: true
        type: string

jobs:
  chocolatey:
    runs-on: windows-latest
    steps:
      - name: Resolve version and download the Windows build
        id: art
        shell: pwsh
        env:
          PLAN: ${{ inputs.plan }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          # workflow_dispatch supplies the tag directly; workflow_call carries it
          # inside the dist plan. Exactly one of the two is ever set.
          $tag = if ($env:TAG_INPUT) { $env:TAG_INPUT } else { ($env:PLAN | ConvertFrom-Json).announcement_tag }
          $version = $tag -replace '^moonlit-v', ''
          $asset = 'moonlit-x86_64-pc-windows-msvc.zip'
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$asset"
          $tmp = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri $url -OutFile $tmp
          $sha = (Get-FileHash $tmp -Algorithm SHA256).Hash.ToLower()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "url=$url"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "checksum=$sha"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          # The tag, not just the version: the icon and release-notes URLs pin to it so each
          # published version points at an immutable tree. Moving a file later cannot then
          # retroactively break an already-listed version's icon.
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Generate package and pack
        shell: pwsh
        env:
          VERSION: ${{ steps.art.outputs.version }}
          URL64: ${{ steps.art.outputs.url }}
          CHECKSUM64: ${{ steps.art.outputs.checksum }}
          TAG: ${{ steps.art.outputs.tag }}
        run: |
          $pkgDir = Join-Path $env:RUNNER_TEMP 'choco'
          New-Item -ItemType Directory -Force -Path (Join-Path $pkgDir 'tools') | Out-Null

          # Single-quoted here-strings do no expansion: __TOKENS__ are literal and
          # replaced below; PowerShell in the install script stays literal (it runs
          # on the end user's machine at install time).
          $nuspec = @'
          <?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2015/06/nuspec.xsd">
            <metadata>
              <id>moonlit</id>
              <version>__VERSION__</version>
              <title>Moonlit</title>
              <authors>Wolfware LLC</authors>
              <owners>Wolfware LLC</owners>
              <projectUrl>https://moonlitbuild.dev/</projectUrl>
              <projectSourceUrl>https://github.com/wolfware-labs/moonlit</projectSourceUrl>
              <packageSourceUrl>https://github.com/wolfware-labs/moonlit</packageSourceUrl>
              <docsUrl>https://moonlitbuild.dev/guide/</docsUrl>
              <bugTrackerUrl>https://github.com/wolfware-labs/moonlit/issues</bugTrackerUrl>
              <iconUrl>__ICONURL__</iconUrl>
              <licenseUrl>https://github.com/wolfware-labs/moonlit/blob/main/LICENSE</licenseUrl>
              <requireLicenseAcceptance>false</requireLicenseAcceptance>
              <copyright>Copyright (c) 2026 Wolfware LLC</copyright>
              <releaseNotes>__RELEASENOTES__</releaseNotes>
              <tags>moonlit release-automation cli wasm</tags>
              <summary>Run release pipelines with sandboxed WebAssembly plugins.</summary>
              <description>Moonlit runs release pipelines defined in YAML, driven by sandboxed WebAssembly component plugins. This package installs the moonlit CLI.</description>
            </metadata>
            <files>
              <file src="tools\**" target="tools" />
            </files>
          </package>
          '@
          # jsDelivr rather than raw.githubusercontent: Chocolatey asks for a CDN-backed icon URL,
          # and raw GitHub links are rate-limited and served with a content type the gallery does
          # not always render. Pinned to the tag, so the URL is immutable per published version.
          # Braced, because the jsDelivr separator is `@` and an unbraced $env:NAME followed by it
          # reads as ambiguous even though PowerShell parses it correctly.
          $iconUrl = "https://cdn.jsdelivr.net/gh/${env:GITHUB_REPOSITORY}@${env:TAG}/assets/moonlit.png"
          $releaseNotes = "https://github.com/${env:GITHUB_REPOSITORY}/releases/tag/${env:TAG}"

          # Prove the icon resolves before packing. This URL is only ever exercised at release
          # time, so an unreachable one fails silently: the package publishes, the listing shows
          # a placeholder, and nobody finds out until they look at chocolatey.org. That already
          # happened once - the icon lived under docs/, which .git/info/exclude keeps out of the
          # repo entirely, so it was in no tag and every URL pointing at it would have 404'd.
          # Retried because jsDelivr fetches from GitHub on first request and a tag pushed
          # moments ago can miss briefly; a transient miss must not fail a release.
          $iconOk = $false
          foreach ($attempt in 1..5) {
            try {
              if ((Invoke-WebRequest -Uri $iconUrl -Method Head -TimeoutSec 20).StatusCode -eq 200) {
                $iconOk = $true
                break
              }
            } catch {
              Write-Host "icon probe attempt ${attempt}: $($_.Exception.Message)"
            }
            if ($attempt -lt 5) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if (-not $iconOk) {
            Write-Error "Icon URL is not reachable after 5 attempts: $iconUrl - refusing to publish a package whose listing would show a placeholder."
            exit 1
          }
          Write-Host "icon OK: $iconUrl"
          $nuspec = $nuspec.Replace('__VERSION__', $env:VERSION).Replace('__ICONURL__', $iconUrl).Replace('__RELEASENOTES__', $releaseNotes)
          Set-Content -Path (Join-Path $pkgDir 'moonlit.nuspec') -Value $nuspec -Encoding utf8

          $install = @'
          $ErrorActionPreference = 'Stop'
          Install-ChocolateyZipPackage -PackageName 'moonlit' -Url64bit '__URL64__' -Checksum64 '__CHECKSUM64__' -ChecksumType64 'sha256' -UnzipLocation "$(Split-Path -Parent $MyInvocation.MyCommand.Definition)"
          '@
          $install = $install.Replace('__URL64__', $env:URL64).Replace('__CHECKSUM64__', $env:CHECKSUM64)
          Set-Content -Path (Join-Path $pkgDir 'tools/chocolateyinstall.ps1') -Value $install -Encoding utf8

          choco pack (Join-Path $pkgDir 'moonlit.nuspec') --version $env:VERSION --outputdirectory $env:RUNNER_TEMP
      - name: Push
        shell: pwsh
        env:
          VERSION: ${{ steps.art.outputs.version }}
          CHOCO_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          # Every push failure fails the release. Until moonlit 0.1.1 cleared
          # moderation the community repo rejected further version pushes from an
          # unverified maintainer with a 403, and this step tolerated that - which
          # silently skipped 1.1.3 through 1.1.6. The package is approved now, so a
          # 403 means a real problem (bad or expired key, revoked account) and must
          # be loud.
          $pkg = Join-Path $env:RUNNER_TEMP "moonlit.$env:VERSION.nupkg"
          choco push $pkg --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
          if ($LASTEXITCODE -ne 0) {
            Write-Error "choco push failed for moonlit $env:VERSION (exit code $LASTEXITCODE)."
            exit $LASTEXITCODE
          }
      - name: Add Chocolatey to the release notes
        shell: pwsh
        env:
          TAG: ${{ steps.art.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TAG
          # This job has no checkout, so gh cannot infer the repo from git —
          # pass it explicitly.
          $repo = $env:GITHUB_REPOSITORY
          $body = gh release view $tag -R $repo --json body --jq '.body'
          if ($body -notmatch 'choco install moonlit') {
            $addition = @'


          ### Install prebuilt binaries via Chocolatey

          ```sh
          choco install moonlit
          ```
          '@
            $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
            ($body + $addition) | Out-File -FilePath $notes -Encoding utf8
            gh release edit $tag -R $repo --notes-file $notes
          } else {
            Write-Host 'Chocolatey section already present; skipping.'
          }
