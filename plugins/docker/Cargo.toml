[package]
name = "moonlit-plugin-docker"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "Elastic-2.0"
publish = false
description = "Moonlit first-party docker plugin."

[lib]
name = "docker"
crate-type = ["cdylib"]

[dependencies]
moonlit-plugin-sdk = { path = "../../sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
