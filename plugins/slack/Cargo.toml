[package]
name = "moonlit-plugin-slack"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false
description = "Moonlit first-party slack plugin."

[lib]
name = "slack"
crate-type = ["cdylib"]

[dependencies]
moonlit-sdk = { path = "../../sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
