[package]
name = "moonlit"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
description = "Moonlit CLI: run release pipelines and render their execution."

# The CLI is `publish = false` (distributed as a binary, not a crate); opt it
# into dist so it is built and released as an application.
[package.metadata.dist]
dist = true

[package.metadata.wix]
upgrade-guid = "246A0B1F-D411-48B8-951B-5BB34C455A67"
path-guid = "47D9882B-124B-4C92-80F4-AD05C8E9DEAD"
license = false
eula = false

[[bin]]
name = "moonlit"
path = "src/main.rs"

[dependencies]
moonlit-engine = { path = "../engine" }
clap.workspace = true
indicatif.workspace = true
comfy-table.workspace = true
console.workspace = true
miette = { workspace = true, features = ["fancy"] }
thiserror.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
serde_json.workspace = true
toml.workspace = true
indexmap.workspace = true
tokio.workspace = true
tokio-util.workspace = true
humantime.workspace = true
wasmparser.workspace = true
cliclack.workspace = true
dirs.workspace = true

[dev-dependencies]
